{% extends "users/base_dashboard.html" %}

{% block content_dashboard %}
<div class="max-w-md mx-auto">
    <div class="mb-8 text-center">
        <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl shadow-lg shadow-blue-50">
            <i class="fas fa-key"></i>
        </div>
        <h1 class="text-2xl font-black text-slate-800 uppercase tracking-tighter">Nueva Credencial</h1>
        <p class="text-slate-500 text-sm">Cambiando contraseña para: <br> <span class="font-bold text-blue-600">{{ usuario_target.email }}</span></p>
    </div>

    <form method="POST" class="bg-white rounded-3xl border border-slate-200 p-8 shadow-sm">
        {% csrf_token %}
        
        <div class="mb-6">
            <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Nueva Contraseña</label>
            <div class="relative">
                <input type="password" name="nueva_password" id="passInput" required
                       class="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl px-4 py-3 focus:border-blue-500 focus:bg-white outline-none transition font-bold text-slate-700">
                <button type="button" onclick="togglePass()" class="absolute right-4 top-3.5 text-slate-400 hover:text-blue-600">
                    <i class="fas fa-eye text-xs"></i>
                </button>
            </div>
        </div>

        <button type="submit" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-black text-sm hover:bg-blue-600 transition shadow-lg shadow-slate-100 uppercase tracking-widest">
            Actualizar Contraseña
        </button>
        
        <a href="{% url 'gestionar_usuarios' request.user.colegio.slug %}" class="block text-center mt-4 text-slate-400 text-xs font-bold hover:text-slate-600 uppercase tracking-widest">
            Cancelar operación
        </a>
    </form>
</div>

<script>
    function togglePass() {
        const input = document.getElementById('passInput');
        input.type = input.type === 'password' ? 'text' : 'password';
    }
</script>
{% endblock %}
