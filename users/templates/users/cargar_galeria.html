{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cargar Fotos - {{ colegio.nombre }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex">
    <div class="w-64 bg-slate-900 text-white p-6 min-h-screen">
        <img src="{{ colegio.logo.url }}" class="h-16 mx-auto mb-6">
        <nav class="space-y-4">
            <a href="{% url 'dashboard_colegio' colegio.slug %}" class="block py-2 px-4 hover:bg-slate-800 rounded-lg text-gray-400">← Volver</a>
        </nav>
    </div>

    <main class="flex-1 p-10">
        <div class="max-w-xl mx-auto">
            <div class="bg-white p-8 rounded-3xl shadow-sm border border-gray-100 text-center">
                <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                </div>
                <h2 class="text-2xl font-bold text-gray-800 mb-2">Subir fotos a la galería</h2>
                <p class="text-gray-500 mb-8 text-sm">Puedes seleccionar varias fotos al mismo tiempo.</p>

                <form method="POST" enctype="multipart/form-data" class="space-y-6">
                    {% csrf_token %}
                    <div>
                        {{ form.fotos }}
                    </div>
                    <button type="submit" class="w-full text-white font-bold py-4 rounded-xl shadow-lg transition-all active:scale-95" 
                            style="background-color: {{ colegio.color_principal }}">
                        Comenzar Subida
                    </button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
