{% extends 'users/base_dashboard.html' %}

{% block content_dashboard %}
<div class="max-w-2xl mx-auto">
    {% if messages %}
        {% for message in messages %}
            <div class="p-4 mb-4 rounded-xl {% if message.tags == 'error' %}bg-red-100 text-red-600{% else %}bg-green-100 text-green-600{% endif %} font-bold">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <div class="mb-8">
        <a href="{% url 'gestionar_docentes' colegio.slug %}" class="text-blue-600 text-sm font-bold hover:underline">
            <i class="fas fa-arrow-left mr-2"></i> Volver al listado
        </a>
        <h1 class="text-3xl font-black text-slate-800 mt-4">Editar Docente</h1>
        <p class="text-slate-500">Modificando el perfil de: {{ docente.nombre }} {{ docente.apellido }}</p>
    </div>

    <form method="POST" class="bg-white p-8 rounded-3xl shadow-sm border border-slate-100 space-y-6">
        {% csrf_token %}
        <div class="grid grid-cols-2 gap-6">
            <div class="col-span-2 md:col-span-1">
                <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Cédula</label>
                <input type="text" name="cedula" value="{{ docente.cedula }}" required class="w-full p-3 bg-slate-50 border-none rounded-xl focus:ring-2 focus:ring-blue-500 uppercase">
            </div>
            <div class="col-span-2 md:col-span-1">
                <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Correo Electrónico</label>
                <input type="email" name="email" value="{{ docente.usuario.email }}" required class="w-full p-3 bg-slate-50 border-none rounded-xl focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Nombres</label>
                <input type="text" name="nombre" value="{{ docente.nombre }}" required class="w-full p-3 bg-slate-50 border-none rounded-xl focus:ring-2 focus:ring-blue-500 uppercase">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Apellidos</label>
                <input type="text" name="apellido" value="{{ docente.apellido }}" required class="w-full p-3 bg-slate-50 border-none rounded-xl focus:ring-2 focus:ring-blue-500 uppercase">
            </div>     
            <div>
                <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Teléfono</label>
                <input type="text" name="telefono" value="{{ docente.telefono }}" class="w-full p-3 bg-slate-50 border-none rounded-xl focus:ring-2 focus:ring-blue-500 uppercase">
            </div>
             <div>
                <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Dirección</label>
                <input type="text" name="direccion" value="{{ docente.direccion }}" class="w-full p-3 bg-slate-50 border-none rounded-xl focus:ring-2 focus:ring-blue-500 uppercase">
            </div>      

            <div>
                <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Fecha de Nacimiento</label>
                <input type="date" name="fecha_nacimiento" value="{{ docente.fecha_nacimiento|date:'Y-m-d' }}" 
                    class="w-full p-3 bg-slate-50 border-none rounded-xl focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Fecha de Ingreso</label>
                <input type="date" name="fecha_inicio" value="{{ docente.detalle_docente.fecha_inicio|date:'Y-m-d' }}" 
                    class="w-full p-3 bg-slate-50 border-none rounded-xl focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Profesión</label>
                <input type="text" name="profesion" value="{{ docente.profesion }}" placeholder="Ej: Lic. en Educación" 
                    class="w-full p-3 bg-slate-50 border-none rounded-xl focus:ring-2 focus:ring-blue-500 uppercase">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase text-slate-400 mb-2">Especialidad</label>
                <input type="text" name="especialidad" value="{{ docente.detalle_docente.especialidad }}" placeholder="Ej: Matemáticas" 
                    class="w-full p-3 bg-slate-50 border-none rounded-xl focus:ring-2 focus:ring-blue-500 uppercase">
            </div>            
        </div>

        <button type="submit" class="w-full bg-slate-800 text-white font-bold py-4 rounded-2xl shadow-lg hover:bg-black transition transform hover:-translate-y-1">
            GUARDAR CAMBIOS
        </button>
    </form>
</div>
{% endblock %}
